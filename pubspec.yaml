name: firebase_quizzapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.7
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.2
  flutter_native_splash: ^2.3.10
  email_validator: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo2.png
    - assets/questioncard.png

flutter_native_splash:
  color: "#1976D2" 
  image: assets/logo.png 
  branding: assets/brainquest.png 
  android: true
  ios: true
  web: false
